<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Login — Smart Parking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B7FF2;
    --blue-2:#4169E1;
    --blue-dark:#2E5BFF;
    --text:#1B2559;
    --muted:#8A93A8;
    --border:#E4E8F3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    font-family:'Inter',sans-serif;color:var(--text);
    min-height:100vh;display:grid;grid-template-columns:1fr 1fr;
  }
  h1,h2,.title{font-family:'Poppins',sans-serif;}

  .side{
    background:linear-gradient(160deg,#5B7FF2,#4169E1);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px;text-align:center;
  }
  .side img{width:140px;height:140px;border-radius:14px;object-fit:cover;background:#fff;margin-bottom:34px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .side .title{font-size:34px;font-weight:800;margin-bottom:14px;}
  .side p{font-size:16px;opacity:.92;max-width:340px;line-height:1.5;}

  .panel{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff;}
  .form-card{width:100%;max-width:400px;}
  .form-card h2{font-size:27px;font-weight:700;text-align:center;margin-bottom:8px;color:var(--blue-dark);}
  .form-card .lede{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:32px;}

  .field{margin-bottom:20px;}
  label{display:block;font-size:13.5px;font-weight:600;color:#3A4360;margin-bottom:7px;}
  input{
    width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:10px;
    font-size:14.5px;font-family:'Inter';color:var(--text);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--blue-dark);box-shadow:0 0 0 3px rgba(46,91,255,.12);}
  input::placeholder{color:#AEB6CC;}

  .password-wrap{position:relative;}
  .password-wrap input{padding-right:42px;}
  .password-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;background:transparent;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
    cursor:pointer;transition:background .15s,color .15s;padding:0;
  }
  .password-toggle:hover{background:#F0F3FB;color:var(--blue-dark);}
  .password-toggle svg{display:block;}

  .err{color:#E5484D;font-size:12.5px;margin-top:6px;display:none;}
  .field.invalid input{border-color:#E5484D;}
  .field.invalid .err{display:block;}

  .submit{
    width:100%;padding:14px;border:none;border-radius:11px;background:var(--blue-dark);
    color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;font-family:'Inter';
    margin-top:6px;transition:background .15s;
  }
  .submit:hover{background:#1E3FCF;}

  .links{text-align:center;margin-top:22px;font-size:14px;}
  .links a{color:var(--blue-dark);text-decoration:none;font-weight:600;}
  .links a:hover{text-decoration:underline;}
  .links .sep{margin:12px 0;color:var(--muted);}

  .demo-note{
    margin-top:26px;background:#F4F6FB;border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.5;
  }

  @media(max-width:860px){
    body{grid-template-columns:1fr;}
    .side{padding:40px 30px;}
    .side img{width:100px;height:100px;margin-bottom:20px;}
    .side .title{font-size:26px;}
  }
</style>
</head>

</div>

<script>
  document.querySelectorAll('.password-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      const input = document.getElementById(btn.dataset.toggleFor);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.querySelectorAll('.eye-open').forEach(function(el){ el.style.display = showing ? '' : 'none'; });
      btn.querySelectorAll('.eye-closed').forEach(function(el){ el.style.display = showing ? 'none' : ''; });
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  async function handleLogin(e){
    e.preventDefault();
    const userVal = document.getElementById('username').value.trim();
    const passVal = document.getElementById('password').value.trim();
    let valid = true;

    document.getElementById('userField').classList.toggle('invalid', !userVal);
    document.getElementById('passField').classList.toggle('invalid', !passVal);
    if(!userVal || !passVal) valid = false;

    if(!valid) return false;

    const btn = document.querySelector('#loginForm button[type="submit"], #loginForm .btn');
    const originalText = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = 'Logging in...'; }

    try{
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: userVal, password: passVal })
      });
      const data = await resp.json();

      if(!resp.ok || !data.ok){
        showLoginError(data.error || 'Login fail ho gaya.');
        return false;
      }

      if(data.user.role === 'admin'){
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'user-dashboard.html';
      }
    } catch(err){
      showLoginError('Server se connect nahi ho saka. Backend chal raha hai?');
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
    }
    return false;
  }

  function showLoginError(msg){
    let el = document.getElementById('loginErrorBox');
    if(!el){
      el = document.createElement('div');
      el.id = 'loginErrorBox';
      el.style.cssText = 'margin-top:14px;padding:10px 14px;background:rgba(229,72,77,.12);border:1px solid #E5484D;color:#E5484D;border-radius:10px;font-size:13.5px;text-align:center;';
      document.getElementById('loginForm').appendChild(el);
    }
    el.textContent = msg;
  }
</script>

</body>
</html>
